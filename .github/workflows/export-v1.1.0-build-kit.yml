name: Export current v1.1.0 source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-v1.1.0-build-kit.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4

      - name: Package current release inputs
        run: |
          set -euo pipefail
          root=/tmp/v1.1.0-current
          rm -rf "$root"
          mkdir -p "$root/plugin" "$root/BepInEx/plugins" "$root/retranslation"
          cp plugin/UnityUndergroundKorean.cs "$root/plugin/"
          cp BepInEx/plugins/UnityUndergroundKorean.dll "$root/BepInEx/plugins/UnityUndergroundKorean.previous.dll"
          cp -a translations "$root/"
          cp retranslation/APPLY_REPORT.json "$root/retranslation/"
          tar -czf /tmp/Unity-Underground-Korean-v1.1.0-current.tar.gz -C /tmp v1.1.0-current
          sha256sum /tmp/Unity-Underground-Korean-v1.1.0-current.tar.gz

      - name: Upload current inputs
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Underground-Korean-v1.1.0-current
          path: /tmp/Unity-Underground-Korean-v1.1.0-current.tar.gz
          if-no-files-found: error
          retention-days: 1
