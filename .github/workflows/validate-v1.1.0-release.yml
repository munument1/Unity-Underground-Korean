name: Finalize v1.1.0 Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-v1.1.0-release.yml
      - plugin/**
      - translations/**
      - retranslation/**
      - tools/**

permissions:
  contents: write

concurrency:
  group: finalize-v1.1.0-runtime
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.pull_request.head.ref == 'agent/finalize-v1.1.0-runtime' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-v1.1.0-runtime
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Preserve previous plugin
        run: |
          set -euo pipefail
          test -s BepInEx/plugins/UnityUndergroundKorean.dll
          cp BepInEx/plugins/UnityUndergroundKorean.dll /tmp/UnityUndergroundKorean.old.dll

      - name: Create assembly-compatible Unity compile stubs
        run: |
          set -euo pipefail
          rm -rf plugin/TMProStub plugin/UnityUIStub
          mkdir -p plugin/TMProStub plugin/UnityUIStub

          cat > plugin/TMProStub/TMProStub.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <LangVersion>7.3</LangVersion>
              <AssemblyName>Unity.TextMeshPro</AssemblyName>
              <RootNamespace>TMPro</RootNamespace>
              <AssemblyVersion>0.0.0.0</AssemblyVersion>
              <FileVersion>0.0.0.0</FileVersion>
              <Version>0.0.0</Version>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="TMProStub.cs" />
              <PackageReference Include="UnityEngine.Modules" Version="2021.3.33" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          cat > plugin/TMProStub/TMProStub.cs <<'EOF'
          using System.Collections.Generic;
          using UnityEngine;

          namespace TMPro
          {
              public class TMP_FontAsset : Object
              {
                  public List<TMP_FontAsset> fallbackFontAssetTable { get; set; }

                  public static TMP_FontAsset CreateFontAsset(
                      string fontName, string styleName, int pointSize)
                  {
                      return null;
                  }
              }

              public class TMP_Settings : Object
              {
                  public static TMP_Settings LoadDefaultSettings()
                  {
                      return null;
                  }
              }

              public class TMP_Text : Object
              {
                  public virtual string text { get; set; }
                  public TMP_FontAsset font { get; set; }

                  public void SetText(string value)
                  {
                  }
              }
          }
          EOF

          cat > plugin/UnityUIStub/UnityUIStub.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <LangVersion>7.3</LangVersion>
              <AssemblyName>UnityEngine.UI</AssemblyName>
              <RootNamespace>UnityEngine.UI</RootNamespace>
              <AssemblyVersion>1.0.0.0</AssemblyVersion>
              <FileVersion>1.0.0.0</FileVersion>
              <Version>1.0.0</Version>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="UnityUIStub.cs" />
              <PackageReference Include="UnityEngine.Modules" Version="2021.3.33" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          cat > plugin/UnityUIStub/UnityUIStub.cs <<'EOF'
          using UnityEngine;

          namespace UnityEngine.UI
          {
              public class Text : Object
              {
                  public virtual string text { get; set; }
                  public Font font { get; set; }
              }
          }
          EOF

          dotnet build plugin/TMProStub/TMProStub.csproj -c Release
          dotnet build plugin/UnityUIStub/UnityUIStub.csproj -c Release
          test -s plugin/TMProStub/bin/Release/netstandard2.0/Unity.TextMeshPro.dll
          test -s plugin/UnityUIStub/bin/Release/netstandard2.0/UnityEngine.UI.dll

      - name: Build plugin without Exiled.Dev.References
        run: |
          set -euo pipefail
          dotnet nuget remove source BepInEx >/dev/null 2>&1 || true
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json --name BepInEx
          rm -f BepInEx/plugins/UnityUndergroundKorean.dll
          cat > plugin/UnityUndergroundKorean.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <LangVersion>7.3</LangVersion>
              <AssemblyName>UnityUndergroundKorean</AssemblyName>
              <RootNamespace>UnityUndergroundKorean</RootNamespace>
              <Version>1.1.0</Version>
              <AssemblyVersion>1.1.0.0</AssemblyVersion>
              <FileVersion>1.1.0.0</FileVersion>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath>
              <OutputPath>../BepInEx/plugins/</OutputPath>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="UnityUndergroundKorean.cs" />
              <Reference Include="Unity.TextMeshPro">
                <HintPath>TMProStub/bin/Release/netstandard2.0/Unity.TextMeshPro.dll</HintPath>
                <Private>false</Private>
              </Reference>
              <Reference Include="UnityEngine.UI">
                <HintPath>UnityUIStub/bin/Release/netstandard2.0/UnityEngine.UI.dll</HintPath>
                <Private>false</Private>
              </Reference>
              <PackageReference Include="BepInEx.Core" Version="5.4.21" PrivateAssets="all" />
              <PackageReference Include="HarmonyX" Version="2.9.0" PrivateAssets="all" />
              <PackageReference Include="Newtonsoft.Json" Version="13.0.2" PrivateAssets="all" />
              <PackageReference Include="UnityEngine.Modules" Version="2021.3.33" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build plugin/UnityUndergroundKorean.csproj -c Release
          test -s BepInEx/plugins/UnityUndergroundKorean.dll

      - name: Inspect assembly identity
        run: |
          set -euo pipefail
          rm -rf /tmp/AssemblyInspector
          dotnet new console -n AssemblyInspector -o /tmp/AssemblyInspector --framework net8.0 --no-restore
          cat > /tmp/AssemblyInspector/Program.cs <<'EOF'
          using System;
          using System.Reflection;

          if (args.Length == 0)
              throw new ArgumentException("assembly path is required");
          AssemblyName name = AssemblyName.GetAssemblyName(args[0]);
          Console.WriteLine($"{name.Name}|{name.Version}|{name.CultureName}|{name.GetPublicKeyToken()?.Length ?? 0}");
          EOF
          dotnet run --project /tmp/AssemblyInspector -- /tmp/UnityUndergroundKorean.old.dll > /tmp/old-assembly.txt
          dotnet run --project /tmp/AssemblyInspector -- BepInEx/plugins/UnityUndergroundKorean.dll > /tmp/new-assembly.txt
          cat /tmp/old-assembly.txt
          cat /tmp/new-assembly.txt
          grep -F 'UnityUndergroundKorean|1.1.0.0|' /tmp/new-assembly.txt

      - name: Validate data and build release candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          report = json.loads(Path('retranslation/APPLY_REPORT.json').read_text(encoding='utf-8'))
          assert report['reviewedLocationCount'] == 7092
          assert report['unresolvedCount'] == 0
          assert report['validationIssueCount'] == 0
          assert report['dynamicSkipCount'] == 48

          translations = sorted(Path('translations').glob('*.json'))
          assert len(translations) == 124, len(translations)
          for path in translations:
              json.loads(path.read_text(encoding='utf-8'))

          source = Path('plugin/UnityUndergroundKorean.cs').read_text(encoding='utf-8')
          marker = '[BepInPlugin("kr.ultima-underworld.korean", "Unity Underground Korean", "1.1.0")]'
          assert marker in source
          for required in (
              'TranslateAssembledGameText',
              'Restoring Game ',
              'Saving Game ',
              'You think it will be ',
              'Your Rune of Warding has been set off ',
          ):
              assert required in source, required

          old_dll = Path('/tmp/UnityUndergroundKorean.old.dll')
          new_dll = Path('BepInEx/plugins/UnityUndergroundKorean.dll')
          old_sha = hashlib.sha256(old_dll.read_bytes()).hexdigest()
          new_sha = hashlib.sha256(new_dll.read_bytes()).hexdigest()

          dist = Path('/tmp/v1.1.0-dist')
          dist.mkdir(exist_ok=True)
          archive = dist / 'Unity-Underground-Korean-v1.1.0.zip'
          fixed_time = (2026, 7, 31, 0, 0, 0)
          files = [(new_dll, 'BepInEx/plugins/UnityUndergroundKorean.dll')]
          files.extend((path, 'translations/' + path.name) for path in translations)
          assert len(files) == 125

          with zipfile.ZipFile(
              archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9
          ) as zf:
              for source_path, target in files:
                  info = zipfile.ZipInfo(target, fixed_time)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(
                      info,
                      source_path.read_bytes(),
                      compress_type=zipfile.ZIP_DEFLATED,
                      compresslevel=9,
                  )

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              assert len(names) == 125
              assert len(set(names)) == 125
              assert zf.testzip() is None

          archive_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          checksum = dist / 'Unity-Underground-Korean-v1.1.0.zip.sha256'
          checksum.write_text(f'{archive_sha}  {archive.name}\n', encoding='ascii')

          audit = {
              'version': '1.1.0',
              'reviewedLocationCount': report['reviewedLocationCount'],
              'unresolvedCount': report['unresolvedCount'],
              'validationIssueCount': report['validationIssueCount'],
              'dynamicSkipCount': report['dynamicSkipCount'],
              'translationJsonCount': len(translations),
              'packageFileCount': len(files),
              'oldPluginBytes': old_dll.stat().st_size,
              'newPluginBytes': new_dll.stat().st_size,
              'oldPluginSha256': old_sha,
              'newPluginSha256': new_sha,
              'oldAssemblyIdentity': Path('/tmp/old-assembly.txt').read_text().strip(),
              'newAssemblyIdentity': Path('/tmp/new-assembly.txt').read_text().strip(),
              'archiveBytes': archive.stat().st_size,
              'archiveSha256': archive_sha,
              'buildMode': 'netstandard2.0 with package references and assembly-compatible Unity UI compile stubs',
              'runtimeReferenceArchive': 'stored privately in Google Drive; not committed to GitHub',
          }
          (dist / 'BUILD_AUDIT.json').write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          Path('retranslation/RUNTIME_FINALIZATION.md').write_text(
              '# v1.1.0 런타임 최종 검증\n\n'
              f'- 플러그인 어셈블리: `{audit["newAssemblyIdentity"]}`\n'
              f'- 기존 DLL: {audit["oldPluginBytes"]} bytes, `{old_sha}`\n'
              f'- 새 DLL: {audit["newPluginBytes"]} bytes, `{new_sha}`\n'
              f'- 번역 JSON: {len(translations)}개\n'
              f'- 배포 파일: {len(files)}개\n'
              f'- 후보 ZIP: {audit["archiveBytes"]} bytes, `{archive_sha}`\n'
              f'- 미해결 원문 대응: {audit["unresolvedCount"]}개\n'
              f'- 구조 검증 오류: {audit["validationIssueCount"]}개\n'
              '- 실제 게임 참조 DLL은 Google Drive에 비공개 보관하며 GitHub에는 커밋하지 않음\n'
              '- 로컬 `plugin/build.ps1`은 실제 게임 DLL을 `/nostdlib+`로 직접 참조\n'
              '- CI는 런타임 어셈블리 정체성과 일치하는 Unity UI 컴파일 스텁만 임시 생성\n',
              encoding='utf-8',
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY
          git diff --check

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Underground-Korean-v1.1.0-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            /tmp/v1.1.0-dist/Unity-Underground-Korean-v1.1.0.zip
            /tmp/v1.1.0-dist/Unity-Underground-Korean-v1.1.0.zip.sha256
            /tmp/v1.1.0-dist/BUILD_AUDIT.json

      - name: Commit finalized runtime and remove diagnostics
        run: |
          set -euo pipefail
          rm -rf plugin/TMProStub plugin/UnityUIStub plugin/UnityUndergroundKorean.csproj
          rm -rf plugin/.game-refs
          rm -f retranslation/RUNTIME_BUILD_LOG.txt
          rm -f tools/finalize_v1_1_runtime.py
          rm -f .github/workflows/validate-v1.1.0-release.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BepInEx/plugins/UnityUndergroundKorean.dll
          git add retranslation/RUNTIME_FINALIZATION.md
          git add -u .github/workflows retranslation tools plugin
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'v1.1.0 플러그인 재빌드 및 릴리스 후보 검증'
          git push origin HEAD:agent/finalize-v1.1.0-runtime
