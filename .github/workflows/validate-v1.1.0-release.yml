name: Validate v1.1.0 Game-Reference Build

on:
  push:
    branches:
      - agent/finalize-v1.1.0-runtime
    paths:
      - .github/workflows/validate-v1.1.0-release.yml
      - plugin/.game-refs/**

permissions:
  contents: write

concurrency:
  group: validate-v1.1.0-game-refs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-v1.1.0-runtime
          fetch-depth: 0

      - name: Check uploaded reference parts
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for part in 00 01 02 03; do
            if [ ! -s "plugin/.game-refs/refs.b64.part${part}" ]; then
              echo "Missing refs.b64.part${part}"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Reconstruct actual game references
        if: steps.refs.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/game-refs
          cat plugin/.game-refs/refs.b64.part* | base64 --decode > /tmp/game-refs.tar.xz
          echo "d19bb07c428fab26ef03b071db54efd0e73742d482c5c00ab20342545df646a2  /tmp/game-refs.tar.xz" | sha256sum --check
          tar -xJf /tmp/game-refs.tar.xz -C /tmp/game-refs
          test -s /tmp/game-refs/core/BepInEx.dll
          test -s /tmp/game-refs/core/0Harmony.dll
          test -s /tmp/game-refs/Managed/mscorlib.dll
          test -s /tmp/game-refs/Managed/netstandard.dll
          test -s /tmp/game-refs/Managed/UnityEngine.CoreModule.dll

      - name: Compile directly against the game assemblies
        if: steps.refs.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp BepInEx/plugins/UnityUndergroundKorean.dll /tmp/UnityUndergroundKorean.old.dll
          dotnet_bin="$(readlink -f "$(command -v dotnet)")"
          dotnet_root="$(dirname "$dotnet_bin")"
          sdk_version="$(dotnet --version)"
          compiler="$dotnet_root/sdk/$sdk_version/Roslyn/bincore/csc.dll"
          test -s "$compiler"

          refs=(
            /tmp/game-refs/Managed/mscorlib.dll
            /tmp/game-refs/Managed/System.Core.dll
            /tmp/game-refs/Managed/netstandard.dll
            /tmp/game-refs/core/BepInEx.dll
            /tmp/game-refs/core/0Harmony.dll
            /tmp/game-refs/Managed/Newtonsoft.Json.dll
            /tmp/game-refs/Managed/UnityEngine.dll
            /tmp/game-refs/Managed/UnityEngine.CoreModule.dll
            /tmp/game-refs/Managed/UnityEngine.UI.dll
            /tmp/game-refs/Managed/Unity.TextMeshPro.dll
            /tmp/game-refs/Managed/UnityEngine.TextRenderingModule.dll
            /tmp/game-refs/Managed/UnityEngine.IMGUIModule.dll
          )
          args=(
            "$compiler"
            /nologo
            /noconfig
            /nostdlib+
            /target:library
            /langversion:7.3
            /optimize+
            /deterministic+
            /out:/tmp/UnityUndergroundKorean.new.dll
          )
          for reference in "${refs[@]}"; do
            test -s "$reference"
            args+=("/reference:$reference")
          done
          args+=(plugin/UnityUndergroundKorean.cs)
          dotnet "${args[@]}"
          test -s /tmp/UnityUndergroundKorean.new.dll
          cp /tmp/UnityUndergroundKorean.new.dll BepInEx/plugins/UnityUndergroundKorean.dll

      - name: Validate translation data and build release candidate
        if: steps.refs.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import struct
          from pathlib import Path

          report = json.loads(Path('retranslation/APPLY_REPORT.json').read_text(encoding='utf-8'))
          assert report['reviewedLocationCount'] == 7092
          assert report['unresolvedCount'] == 0
          assert report['validationIssueCount'] == 0
          assert report['dynamicSkipCount'] == 48

          translations = sorted(Path('translations').glob('*.json'))
          assert len(translations) == 124, len(translations)
          for path in translations:
              json.loads(path.read_text(encoding='utf-8'))

          source = Path('plugin/UnityUndergroundKorean.cs').read_text(encoding='utf-8')
          assert '[BepInPlugin("kr.ultima-underworld.korean", "Unity Underground Korean", "1.1.0")]' in source
          for required in (
              'TranslateAssembledGameText', 'Restoring Game ', 'Saving Game ',
              'You think it will be ', 'Your Rune of Warding has been set off '
          ):
              assert required in source, required

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          audit = {
              'version': '1.1.0',
              'reviewedLocationCount': report['reviewedLocationCount'],
              'unresolvedCount': report['unresolvedCount'],
              'validationIssueCount': report['validationIssueCount'],
              'dynamicSkipCount': report['dynamicSkipCount'],
              'translationJsonCount': len(translations),
              'oldPluginBytes': Path('/tmp/UnityUndergroundKorean.old.dll').stat().st_size,
              'newPluginBytes': Path('BepInEx/plugins/UnityUndergroundKorean.dll').stat().st_size,
              'oldPluginSha256': sha256('/tmp/UnityUndergroundKorean.old.dll'),
              'newPluginSha256': sha256('BepInEx/plugins/UnityUndergroundKorean.dll'),
              'referenceAssemblies': {
                  'BepInEx': '5.4.23.5',
                  '0Harmony': '2.9.0.0',
                  'Newtonsoft.Json': '13.0.0.0',
                  'mscorlib': '4.0.0.0',
                  'netstandard': '2.1.0.0',
              },
              'buildMode': 'Roslyn csc.dll with /nostdlib+ and uploaded game assemblies',
          }
          Path('/tmp/BUILD_AUDIT.json').write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

          rm -rf /tmp/Unity-Underground-Korean-v1.1.0
          mkdir -p /tmp/Unity-Underground-Korean-v1.1.0/BepInEx/plugins
          mkdir -p /tmp/Unity-Underground-Korean-v1.1.0/translations
          cp BepInEx/plugins/UnityUndergroundKorean.dll /tmp/Unity-Underground-Korean-v1.1.0/BepInEx/plugins/
          cp translations/*.json /tmp/Unity-Underground-Korean-v1.1.0/translations/
          (
            cd /tmp/Unity-Underground-Korean-v1.1.0
            find . -type f -printf '%P\n' | LC_ALL=C sort > /tmp/release-files.txt
            test "$(wc -l < /tmp/release-files.txt)" -eq 125
            zip -9 -X /tmp/Unity-Underground-Korean-v1.1.0.zip -@ < /tmp/release-files.txt
          )
          unzip -t /tmp/Unity-Underground-Korean-v1.1.0.zip
          test "$(unzip -Z1 /tmp/Unity-Underground-Korean-v1.1.0.zip | wc -l)" -eq 125
          (
            cd /tmp
            sha256sum Unity-Underground-Korean-v1.1.0.zip > Unity-Underground-Korean-v1.1.0.zip.sha256
          )
          git diff --check

      - name: Upload release candidate
        if: steps.refs.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Underground-Korean-v1.1.0-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            /tmp/Unity-Underground-Korean-v1.1.0.zip
            /tmp/Unity-Underground-Korean-v1.1.0.zip.sha256
            /tmp/BUILD_AUDIT.json

      - name: Commit rebuilt plugin
        if: steps.refs.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BepInEx/plugins/UnityUndergroundKorean.dll
          if git diff --cached --quiet; then
            echo 'The rebuilt DLL is byte-identical to the current DLL.'
            exit 0
          fi
          git commit -m '실제 게임 DLL 참조로 v1.1.0 플러그인 재빌드'
          git push origin HEAD:agent/finalize-v1.1.0-runtime
