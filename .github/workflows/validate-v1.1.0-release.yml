name: Finalize v1.1.0 Runtime

on:
  push:
    branches:
      - agent/finalize-v1.1.0-runtime
    paths:
      - .github/workflows/validate-v1.1.0-release.yml
      - tools/finalize_v1_1_runtime.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-v1.1.0-runtime
          fetch-depth: 0

      - name: Prepare source and translations
        id: prepare
        continue-on-error: true
        run: |
          set -o pipefail
          exec > >(tee retranslation/RUNTIME_BUILD_LOG.txt) 2>&1
          python -m py_compile tools/finalize_v1_1_runtime.py
          python tools/finalize_v1_1_runtime.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_completed_retranslations.py')
          text = path.read_text(encoding='utf-8')
          old = '    "Your Rune of Warding has been set off ", "You see ",\n}'
          new = '    "Your Rune of Warding has been set off ", "You see ",\n    "Restoring Game ", "Saving Game ",\n}'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif '"Restoring Game ", "Saving Game ",' not in text:
              raise SystemExit('save/restore dynamic source insertion point not found')
          PY
          python -m py_compile tools/apply_completed_retranslations.py
          mkdir -p tools/output
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/hankmorgan/UnderworldExporter/master/uw1_stringsclean.txt \
            --output tools/output/uw1_stringsclean.txt
          python tools/prepare_retranslation_application.py
          python tools/apply_completed_retranslations.py \
            --source-list tools/output/uw1_stringsclean.txt \
            --report retranslation/APPLY_REPORT.json \
            --max-unresolved 0

      - name: Build plugin
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          exec >> >(tee -a retranslation/RUNTIME_BUILD_LOG.txt) 2>&1
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json \
            --name BepInEx
          rm -f BepInEx/plugins/UnityUndergroundKorean.dll
          cat > plugin/UnityUndergroundKorean.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <LangVersion>7.3</LangVersion>
              <AssemblyName>UnityUndergroundKorean</AssemblyName>
              <RootNamespace>UnityUndergroundKorean</RootNamespace>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath>
              <OutputPath>../BepInEx/plugins/</OutputPath>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="UnityUndergroundKorean.cs" />
              <PackageReference Include="BepInEx.Core" Version="5.4.21" PrivateAssets="all" />
              <PackageReference Include="HarmonyX" Version="2.9.0" PrivateAssets="all" />
              <PackageReference Include="Newtonsoft.Json" Version="13.0.2" PrivateAssets="all" />
              <PackageReference Include="UnityEngine.Modules" Version="2021.3.33" PrivateAssets="all" />
              <PackageReference Include="Exiled.Dev.References" Version="1.0.4" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build plugin/UnityUndergroundKorean.csproj -c Release
          test -s BepInEx/plugins/UnityUndergroundKorean.dll

      - name: Validate output
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          exec >> >(tee -a retranslation/RUNTIME_BUILD_LOG.txt) 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('retranslation/APPLY_REPORT.json').read_text(encoding='utf-8'))
          assert report['reviewedLocationCount'] == 7092
          assert report['unresolvedCount'] == 0
          assert report['validationIssueCount'] == 0
          assert report['dynamicSkipCount'] == 48
          paths = sorted(Path('translations').glob('*.json'))
          assert len(paths) == 124
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
          source = Path('plugin/UnityUndergroundKorean.cs').read_text(encoding='utf-8')
          assert '"1.1.0"' in source
          assert 'TranslateAssembledGameText' in source
          dll = Path('BepInEx/plugins/UnityUndergroundKorean.dll')
          assert dll.is_file() and dll.stat().st_size > 0
          print(json.dumps({
              'dynamicSkipCount': report['dynamicSkipCount'],
              'changedGlobalEntryCount': report['changedGlobalEntryCount'],
              'unresolvedCount': report['unresolvedCount'],
              'translationJsonCount': len(paths),
              'pluginBytes': dll.stat().st_size,
          }, ensure_ascii=False, indent=2))
          PY
          git diff --check

      - name: Record result and commit
        if: always()
        run: |
          rm -f plugin/UnityUndergroundKorean.csproj
          {
            echo
            echo "prepare=${{ steps.prepare.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "validate=${{ steps.validate.outcome }}"
          } >> retranslation/RUNTIME_BUILD_LOG.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add retranslation/RUNTIME_BUILD_LOG.txt
          if [ "${{ steps.prepare.outcome }}" = "success" ]; then
            git add plugin/UnityUndergroundKorean.cs tools/apply_completed_retranslations.py \
              retranslation/APPLY_REPORT.json translations/global_text_map.json
          fi
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            git add BepInEx/plugins/UnityUndergroundKorean.dll
          fi
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m "v1.1.0 런타임 빌드 결과 기록 [runtime-build]"
            git push origin HEAD:agent/finalize-v1.1.0-runtime
          fi

      - name: Fail when finalization failed
        if: always()
        run: |
          test "${{ steps.prepare.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.validate.outcome }}" = "success"
