name: Finalize v1.1.0 Runtime

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/apply-retranslation-v1.1.0

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/apply-retranslation-v1.1.0') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[runtime-finalized]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out application branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-retranslation-v1.1.0
          fetch-depth: 0

      - name: Refine translation map rules
        run: |
          python -m py_compile tools/refine_v1_1_0_map.py
          python tools/refine_v1_1_0_map.py
          mkdir -p tools/output
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/hankmorgan/UnderworldExporter/master/uw1_stringsclean.txt \
            --output tools/output/uw1_stringsclean.txt
          python tools/prepare_retranslation_application.py
          python tools/apply_completed_retranslations.py \
            --source-list tools/output/uw1_stringsclean.txt \
            --report retranslation/APPLY_REPORT.json \
            --max-unresolved 0

      - name: Build dynamic sentence companion plugin
        run: bash tools/build_plugin_ci.sh

      - name: Validate finalized output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('retranslation/APPLY_REPORT.json').read_text(encoding='utf-8'))
          assert report['reviewedLocationCount'] == 7092
          assert report['unresolvedCount'] == 0
          assert report['validationIssueCount'] == 0
          assert report['dynamicSkipCount'] == 48
          files = sorted(Path('translations').glob('*.json'))
          assert len(files) == 124
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          source = Path('plugin/UnityUndergroundKoreanRuntime.cs').read_text(encoding='utf-8')
          assert '"1.1.0"' in source
          assert 'TranslateAssembled' in source
          runtime_dll = Path('BepInEx/plugins/UnityUndergroundKorean.Runtime.dll')
          assert runtime_dll.is_file()
          print(json.dumps({
              'dynamicSkipCount': report['dynamicSkipCount'],
              'changedGlobalEntryCount': report['changedGlobalEntryCount'],
              'translationJsonCount': len(files),
              'runtimePluginBytes': runtime_dll.stat().st_size,
          }, ensure_ascii=False, indent=2))
          PY
          git diff --check

      - name: Commit finalized runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f translations/.runtime-finalization-trigger
          git add plugin/UnityUndergroundKoreanRuntime.cs \
            BepInEx/plugins/UnityUndergroundKorean.Runtime.dll \
            tools/apply_completed_retranslations.py tools/refine_v1_1_0_map.py \
            tools/build_plugin_ci.sh retranslation/APPLY_REPORT.json translations
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'v1.1.0 동적 문장 처리 및 전역 맵 최종 보강 [runtime-finalized]'
          git push origin HEAD:agent/apply-retranslation-v1.1.0
