name: Finalize and release v1.1.0

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-and-release-v1.1.0
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize repository and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/finalize_release_v1_1_0.sh
