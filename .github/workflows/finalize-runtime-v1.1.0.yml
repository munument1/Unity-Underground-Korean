name: Finalize v1.1.0 Runtime

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/apply-retranslation-v1.1.0

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/apply-retranslation-v1.1.0') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[runtime-finalized]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out application branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-retranslation-v1.1.0
          fetch-depth: 0

      - name: Finalize source and translation map rules
        run: |
          python -m py_compile tools/finalize_v1_1_0_runtime.py
          python tools/finalize_v1_1_0_runtime.py
          mkdir -p tools/output
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/hankmorgan/UnderworldExporter/master/uw1_stringsclean.txt \
            --output tools/output/uw1_stringsclean.txt
          python tools/prepare_retranslation_application.py
          python tools/apply_completed_retranslations.py \
            --source-list tools/output/uw1_stringsclean.txt \
            --report retranslation/APPLY_REPORT.json \
            --max-unresolved 0

      - name: Build runtime plugin
        run: |
          cat > plugin/UnityUndergroundKorean.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <LangVersion>7.3</LangVersion>
              <AssemblyName>UnityUndergroundKorean</AssemblyName>
              <RootNamespace>UnityUndergroundKorean</RootNamespace>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath>
              <OutputPath>../BepInEx/plugins/</OutputPath>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="UnityUndergroundKorean.cs" />
              <PackageReference Include="BepInEx.Core" Version="5.4.21" PrivateAssets="all" />
              <PackageReference Include="HarmonyX" Version="2.9.0" PrivateAssets="all" />
              <PackageReference Include="Newtonsoft.Json" Version="13.0.2" PrivateAssets="all" />
              <PackageReference Include="UnityEngine.Modules" Version="2021.3.33" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build plugin/UnityUndergroundKorean.csproj -c Release
          test -f BepInEx/plugins/UnityUndergroundKorean.dll

      - name: Validate finalized output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('retranslation/APPLY_REPORT.json').read_text(encoding='utf-8'))
          assert report['reviewedLocationCount'] == 7092
          assert report['unresolvedCount'] == 0
          assert report['validationIssueCount'] == 0
          assert report['dynamicSkipCount'] < 100
          files = sorted(Path('translations').glob('*.json'))
          assert len(files) == 124
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          source = Path('plugin/UnityUndergroundKorean.cs').read_text(encoding='utf-8')
          assert '"1.1.0"' in source
          assert 'TranslateAssembledGameText' in source
          print(json.dumps({
              'dynamicSkipCount': report['dynamicSkipCount'],
              'changedGlobalEntryCount': report['changedGlobalEntryCount'],
              'translationJsonCount': len(files),
              'pluginBytes': Path('BepInEx/plugins/UnityUndergroundKorean.dll').stat().st_size,
          }, ensure_ascii=False, indent=2))
          PY
          git diff --check

      - name: Commit finalized runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f plugin/UnityUndergroundKorean.csproj
          git add plugin/UnityUndergroundKorean.cs BepInEx/plugins/UnityUndergroundKorean.dll \
            tools/apply_completed_retranslations.py tools/finalize_v1_1_0_runtime.py \
            retranslation/APPLY_REPORT.json translations
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'v1.1.0 동적 문장 처리 및 전역 맵 최종 보강 [runtime-finalized]'
          git push origin HEAD:agent/apply-retranslation-v1.1.0
